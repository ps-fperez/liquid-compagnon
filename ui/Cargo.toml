[package]
name = "lc-ui"
description = "Interface Leptos (WebAssembly) de Liquid Compagnon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lc-shared-dto.workspace = true
serde.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
leptos = { version = "0.8.22", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Document", "Window", "Storage", "Event", "EventTarget", "Touch", "TouchEvent", "TouchList"] }

[dev-dependencies]
rust_decimal_macros.workspace = true

[lints]
workspace = true
