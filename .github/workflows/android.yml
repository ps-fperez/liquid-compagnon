name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentation et spécifications seules : pas de nouvel APK (l'app proposerait une mise à jour
    # sans changement). Ces filtres ne s'appliquent pas aux tags.
    paths-ignore:
      - "docs/**"
      - "openspec/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.22.0

jobs:
  check:
    name: Qualité (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  apk:
    name: APK Android (arm64)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      # Le plugin Gradle généré appelle `cargo tauri` : on installe la CLI Rust (mise en cache par rust-cache).
      - name: Outils (Trunk, Tauri CLI)
        run: |
          command -v trunk || curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"
          command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked

      - name: Clé de signature (si configurée)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "password=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
            } > src-tauri/gen/android/keystore.properties
            echo "BUILD_KIND=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Aucune clé de signature : APK de debug (désinstallation requise à chaque mise à jour). Voir scripts/new-keystore.ps1."
            echo "BUILD_KIND=debug" >> "$GITHUB_ENV"
          fi

      # Identité du build, compilée dans l'app : elle compare son numéro à latest.json pour proposer
      # les mises à jour. Le versionCode croît à chaque run : un APK récent s'installe par-dessus.
      - name: Build APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export LC_BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          export LC_COMMIT="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export LC_UPDATE_CHANNEL=stable
          else
            export LC_UPDATE_CHANNEL=dernier-build
          fi
          echo "LC_UPDATE_CHANNEL=$LC_UPDATE_CHANNEL" >> "$GITHUB_ENV"
          CONFIG="{\"bundle\":{\"android\":{\"versionCode\":$((100000 + GITHUB_RUN_NUMBER))}}}"
          if [ "$BUILD_KIND" = "release" ]; then
            cargo tauri android build --apk --target aarch64 --config "$CONFIG"
          else
            cargo tauri android build --apk --debug --target aarch64 --config "$CONFIG"
          fi
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          OUT="liquid-compagnon-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}-${BUILD_KIND}.apk"
          cp "$APK" "$OUT"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      # Annonce de version lue par l'application (src-tauri/src/updater.rs) : numéro de build,
      # URL, taille et empreinte SHA-256 de l'APK publié avec elle.
      - name: Manifeste latest.json
        run: |
          if [ "$LC_UPDATE_CHANNEL" = "stable" ]; then TAG="$GITHUB_REF_NAME"; else TAG=dernier-build; fi
          jq -n \
            --argjson build "$GITHUB_RUN_NUMBER" \
            --arg version "$(jq -r .version src-tauri/tauri.conf.json)" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg channel "$LC_UPDATE_CHANNEL" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_FILE" \
            --argjson size "$(stat -c %s "$APK_FILE")" \
            --arg sha256 "$(sha256sum "$APK_FILE" | cut -d' ' -f1)" \
            --arg notes "$(git log -1 --pretty=%s)" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{build: $build, version: $version, commit: $commit, channel: $channel, url: $url,
              size: $size, sha256: $sha256, notes: $notes, published_at: $published_at}' \
            > latest.json
          cat latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}
          retention-days: 30

      # Dernier build de main : URL fixe à ouvrir depuis le téléphone (…/releases/tag/dernier-build)
      - name: Publier « dernier-build »
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dernier-build --cleanup-tag --yes || true
          gh release create dernier-build "$APK_FILE" latest.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dernier build (${GITHUB_SHA::7})" \
            --notes "APK construit automatiquement depuis main. Build : $BUILD_KIND."

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_FILE" latest.json \
            --title "Liquid Compagnon $GITHUB_REF_NAME" \
            --generate-notes
