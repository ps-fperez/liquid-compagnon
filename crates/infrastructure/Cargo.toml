[package]
name = "lc-infrastructure"
description = "Adaptateurs de Liquid Compagnon : SQLite, fournisseurs de cours, horloge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lc-domain.workspace = true
lc-application.workspace = true
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
chrono = { workspace = true, features = ["clock", "serde"] }
uuid.workspace = true
# SQLite embarqué (pas de dépendance au SQLite système d'Android)
rusqlite = { version = "0.40", features = ["bundled"] }
# Hachage du PIN (sel tiré du générateur aléatoire du système)
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
# HTTP : rustls + ring + certificats racine embarqués (pas d'OpenSSL ni de JNI sur Android)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
rust_decimal_macros.workspace = true
uuid = { workspace = true, features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints]
workspace = true
