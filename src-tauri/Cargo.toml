[package]
name = "liquid-compagnon"
description = "Liquid Compagnon — backend Tauri (couche présentation et composition root)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "liquid_compagnon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
lc-domain.workspace = true
lc-application.workspace = true
lc-infrastructure.workspace = true
lc-shared-dto.workspace = true
serde.workspace = true
serde_json.workspace = true
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
# Sélecteur de fichiers et accès aux fichiers choisis (export / import JSON)
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[dev-dependencies]
rust_decimal.workspace = true
rust_decimal_macros.workspace = true

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Empreinte / reconnaissance faciale (BiometricPrompt sur Android)
tauri-plugin-biometric = "2"

[lints]
workspace = true
